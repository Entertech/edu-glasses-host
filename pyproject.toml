[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.1,<4", "mypy>=1.13,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "looktech-glasses-sdk"
version = "0.6.0"
description = "Python SDK for Looktech Glasses: device control, media capture, sensors, events, OTA updates, and Wi-Fi media export."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
audio = ["opuslib>=3.0.1"]
macos = ["pyobjc-core>=10; sys_platform == 'darwin'", "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'"]

[tool.setuptools]
py-modules = []
include-package-data = false

[tool.setuptools.packages.find]
include = ["looktech_glasses_sdk*"]

[tool.cibuildwheel]
build = "cp3{9,10,11,12,13,14}-*"
skip = "*-musllinux* *-win32 *-manylinux_i686"
test-command = "python {project}/scripts/verify_installed.py && python -m unittest discover -s {project}/tests -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
test-extras = ["macos"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
