[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-glasses-host"
version = "0.3.0"
description = "Python SDK for Looktech education glasses (EDU v1)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
audio = ["opuslib>=3.0.1"]
macos = ["pyobjc-core>=10; sys_platform == 'darwin'", "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["edu_host*"]
